name: "Sync Upstream"

on:
  workflow_dispatch:
  schedule:
    - cron: "18,48 * * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: benchmark-obs-studio-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync With Upstream
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Advance the adjacent source pair
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/advance-source-pair.sh benchmark-source.env OBS

      - name: Commit the upstream update
        id: sync
        run: |
          set -euo pipefail
          echo "updated=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- benchmark-source.env; then
            echo "No upstream changes"
            exit 0
          fi

          git config user.name "boringcache-bot"
          git config user.email "boringcache-bot@users.noreply.github.com"
          git add benchmark-source.env
          git commit -m "Update upstream to ${{ steps.source.outputs.source_repository }}@${{ steps.source.outputs.source_short_sha }}"
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch rolling benchmarks
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run obs-actions-cache.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run obs-boringcache.yml --repo "$GITHUB_REPOSITORY" --ref main

name: "OBS Studio Xcode cache continuation"

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: "Optional exact BoringCache CLI release or prerelease tag"
        required: false
        default: ""
        type: string
      generation:
        description: "One-based continuation generation"
        required: true
        type: number
      parent_sha:
        description: "Exact parent OBS commit"
        required: true
        type: string
      source_sha:
        description: "Exact child OBS commit"
        required: true
        type: string
      obs_version:
        description: "Semantic OBS version used for CMake generation"
        required: true
        type: string
      actions_restore_key:
        description: "Exact Actions cache key produced by the prior generation"
        required: true
        type: string
      actions_save_key:
        description: "New immutable Actions cache key for this generation"
        required: true
        type: string
      boringcache_seed_run_id:
        description: "Run ID whose immutable BoringCache seed is the fallback"
        required: true
        type: string
      boringcache_seed_run_attempt:
        description: "Attempt that produced the BoringCache seed"
        required: true
        default: "1"
        type: string
permissions:
  actions: write
  contents: read

env:
  OBS_SOURCE_SHA: ${{ inputs.source_sha }}
  OBS_PARENT_SHA: ${{ inputs.parent_sha }}
  OBS_VERSION_OVERRIDE: ${{ inputs.obs_version }}

jobs:
  actions-cache:
    name: GitHub Actions OBS Xcode generation ${{ inputs.generation }}
    runs-on: macos-26
    timeout-minutes: 120
    env:
      XCODE_CAS_PATH: ${{ github.workspace }}/.xcode-compilation-cache
      OBS_BASELINE_DERIVED_DATA_PATH: ${{ github.workspace }}/.xcode-derived-data
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read pinned source settings
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout continuation OBS source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}
          ref: ${{ env.OBS_SOURCE_SHA }}
          path: upstream
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify adjacent source and prepare child commit
        run: ./scripts/prepare-continuation-source.sh "$OBS_SOURCE_SHA" "$OBS_PARENT_SHA"

      - name: Start cache restore timing
        id: restore_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore previous Xcode compilation cache generation
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ inputs.actions_restore_key }}
          path: .xcode-compilation-cache
          fail-on-cache-miss: true

      - name: Capture cache restore timing and size
        id: restore
        run: |
          echo "seconds=$(( $(date +%s) - ${{ steps.restore_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"
          echo "bytes=$(( $(du -sk "$XCODE_CAS_PATH" | cut -f1) * 1024 ))" >> "$GITHUB_OUTPUT"

      - name: Select upstream's pinned Xcode
        run: sudo xcode-select --switch "${{ steps.source.outputs.OBS_XCODE_PATH }}"

      - name: Build continuation commit
        id: build
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          python3 ./scripts/run-benchmark-plan.py xcode --working-directory upstream \
            2>&1 | tee benchmark-results/xcode-actions-cache-continuation.log
          echo "seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"

      - name: Require native Xcode build evidence
        run: ./scripts/verify_xcode_build_log.py benchmark-results/xcode-actions-cache-continuation.log

      - name: Capture evolved cache size
        id: evolved
        run: echo "bytes=$(( $(du -sk "$XCODE_CAS_PATH" | cut -f1) * 1024 ))" >> "$GITHUB_OUTPUT"

      - name: Start cache save timing
        id: save_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Save evolved Xcode compilation cache generation
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ inputs.actions_save_key }}
          path: .xcode-compilation-cache

      - name: Capture cache save timing
        id: save
        run: echo "seconds=$(( $(date +%s) - ${{ steps.save_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Write continuation result
        run: |
          ./scripts/write_continuation_result.py \
            --strategy actions-cache \
            --generation "${{ inputs.generation }}" \
            --parent-sha "$OBS_PARENT_SHA" \
            --source-sha "$OBS_SOURCE_SHA" \
            --restore-seconds "${{ steps.restore.outputs.seconds }}" \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --save-seconds "${{ steps.save.outputs.seconds }}" \
            --restore-key "${{ inputs.actions_restore_key }}" \
            --save-key "${{ inputs.actions_save_key }}" \
            --cache-bytes-before "${{ steps.restore.outputs.bytes }}" \
            --cache-bytes-after "${{ steps.evolved.outputs.bytes }}"

      - name: Upload Actions Cache continuation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: continuation-xcode-actions-cache-g${{ inputs.generation }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 30

  boringcache:
    name: BoringCache OBS Xcode generation ${{ inputs.generation }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Require BoringCache restore and save credentials
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
        run: |
          test -n "$BORINGCACHE_RESTORE_TOKEN"
          test -n "$BORINGCACHE_SAVE_TOKEN"

      - name: Checkout benchmark repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read pinned source settings
        id: source
        run: sed '/^$/d' benchmark-source.env >> "$GITHUB_OUTPUT"

      - name: Checkout continuation OBS source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ steps.source.outputs.OBS_SOURCE_REPOSITORY }}
          ref: ${{ env.OBS_SOURCE_SHA }}
          path: upstream
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify source and configure the evolving Xcode cache
        run: |
          ./scripts/prepare-continuation-source.sh "$OBS_SOURCE_SHA" "$OBS_PARENT_SHA"
          ./scripts/scope_boringcache_plan.py \
            xcode \
            "${{ inputs.boringcache_seed_run_id }}" \
            "${{ inputs.boringcache_seed_run_attempt }}"
          sudo xcode-select --switch "${{ steps.source.outputs.OBS_XCODE_PATH }}"

      - name: Start cache setup timing
        id: restore_start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Configure evolving BoringCache Xcode adapter
        id: cache
        uses: boringcache/one@1d01e5dbf19ce259f921aa353d5e3e4ac5f942e4 # v1 / 1.19.0
        with:
          cli-version: ${{ inputs.cli_version }}
          trust-policy: publish
          setup: none
          mode: xcode
          working-directory: ./upstream
          fail-on-cache-error: true
          metadata-hints: |
            benchmark=obs-studio-xcode-continuation
            phase=commit
            generation=${{ inputs.generation }}
            tool=xcode
        env:
          BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
          BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

      - name: Capture cache setup timing
        id: restore
        run: echo "seconds=$(( $(date +%s) - ${{ steps.restore_start.outputs.started_at }} ))" >> "$GITHUB_OUTPUT"

      - name: Build continuation commit
        id: build
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          python3 ./scripts/run-benchmark-plan.py xcode --working-directory upstream \
            2>&1 | tee benchmark-results/xcode-boringcache-continuation.log
          echo "seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"

      - name: Require native Xcode build evidence
        run: ./scripts/verify_xcode_build_log.py benchmark-results/xcode-boringcache-continuation.log

      - name: Write continuation result
        run: |
          ./scripts/write_continuation_result.py \
            --strategy boringcache \
            --generation "${{ inputs.generation }}" \
            --parent-sha "$OBS_PARENT_SHA" \
            --source-sha "$OBS_SOURCE_SHA" \
            --restore-seconds "${{ steps.restore.outputs.seconds }}" \
            --build-seconds "${{ steps.build.outputs.seconds }}" \
            --restore-key "obs-studio-xcode-r${{ inputs.boringcache_seed_run_id }}-a${{ inputs.boringcache_seed_run_attempt }}" \
            --save-key "obs-studio-xcode-r${{ inputs.boringcache_seed_run_id }}-a${{ inputs.boringcache_seed_run_attempt }}"

      - name: Upload BoringCache continuation result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: continuation-xcode-boringcache-g${{ inputs.generation }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 30

      - name: Retain BoringCache product evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boringcache-product-xcode-continuation-g${{ inputs.generation }}
          path: ${{ steps.cache.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare continuation generation
    needs: [actions-cache, boringcache]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download continuation results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: continuation-xcode-*-g${{ inputs.generation }}
          path: continuation-results

      - name: Render continuation comparison
        run: ./scripts/render_continuation.py --input-dir continuation-results --output-dir benchmark-results

      - name: Publish job summary
        run: cat benchmark-results/continuation-comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload continuation comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-obs-xcode-continuation-g${{ inputs.generation }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 30
